# Pings the Render instance so it doesn't sleep.
#
# THE SCHEDULE IS OFF ON PURPOSE. This repo doesn't get steady traffic, and
# an automatic ping every 10 minutes would spend ~510 of the 750 free
# instance-hours per month keeping the app awake for nobody. Running out
# doesn't cost money, but it does take the app offline until the 1st of the
# following month, and the quota is shared with any other free service on
# the account.
#
# The landing page handles cold starts on its own: a visitor waits ~40s
# behind a progress bar instead of a blank tab. That's the better trade at
# this level of traffic.
#
# Run it by hand before a demo or presentation:
#   Actions -> Keep Render awake -> Run workflow
#
# To put it back on automatic, uncomment the two schedule lines below.
#
# Set APP_URL as a repository variable:
#   Settings -> Secrets and variables -> Actions -> Variables -> New
#   Name: APP_URL   Value: https://<your-service>.onrender.com

name: Keep Render awake

on:
  # Disabled — see the note above. Uncomment to resume automatic pings
  # every 10 minutes between 03:00 and 19:00 UTC (08:30-00:30 IST).
  # schedule:
  #   - cron: "*/10 3-19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -uo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "::warning::APP_URL variable is not set; nothing to ping."
            exit 0
          fi

          url="${APP_URL%/}/_stcore/health"

          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
                     --max-time 120 --retry 0 "$url" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            [ "$code" = "200" ] && { echo "Service is awake."; exit 0; }
            sleep 20
          done

          # A failed ping must not spam the repo with red runs; the landing
          # page still wakes the service on demand.
          echo "::warning::Health check did not return 200 after 3 attempts."
