# Keeps the Render free instance warm during the hours people actually
# use it, so the landing page usually has nothing to wake.
#
# Why not 24/7: the free tier grants 750 instance-hours a month. Pinging
# round the clock burns ~730 of them on this one service, leaving no room
# for anything else. The window below costs ~510 h/month.
#
# Set APP_URL as a repository variable:
#   Settings -> Secrets and variables -> Actions -> Variables -> New
#   Name: APP_URL   Value: https://<your-service>.onrender.com

name: Keep Render awake

on:
  schedule:
    # Every 10 minutes, 03:00-19:00 UTC (08:30-00:30 IST).
    - cron: "*/10 3-19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -uo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "::warning::APP_URL variable is not set; nothing to ping."
            exit 0
          fi

          url="${APP_URL%/}/_stcore/health"

          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
                     --max-time 120 --retry 0 "$url" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            [ "$code" = "200" ] && { echo "Service is awake."; exit 0; }
            sleep 20
          done

          # A failed ping must not spam the repo with red runs; the landing
          # page still wakes the service on demand.
          echo "::warning::Health check did not return 200 after 3 attempts."
